<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dotquill</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><img src="/favicon.svg" alt="" width="18" height="18" /> Dotquill</div>
      <div class="ws" id="ws" title="Workspace folder"></div>
      <label class="check" title="Switch to the asset Claude is working on">
        <input type="checkbox" id="follow" checked /> Follow Claude
      </label>
      <span class="status" id="status" title="Live updates: disconnected"></span>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <input id="search" class="search" type="search" placeholder="Filter assets" autocomplete="off" />
        <ul id="assets" class="assets"></ul>
        <p id="noAssets" class="hint" hidden>
          No assets yet. Ask Claude to draw something, e.g. “draw a 16×16 slime with an idle animation”.
        </p>
      </aside>

      <section class="stage">
        <div class="toolbar">
          <div class="group">
            <button id="zoomOut" title="Zoom out (−)">−</button>
            <button id="zoomLabel" class="zoom" title="Fit (0)">8×</button>
            <button id="zoomIn" title="Zoom in (+)">+</button>
          </div>
          <label class="check"><input type="checkbox" id="grid" checked /> Grid</label>
          <label class="check"><input type="checkbox" id="onion" /> Onion skin</label>
          <label class="check"><input type="checkbox" id="tile" /> Tile 3×3</label>
          <label class="check" id="slicesToggle" hidden title="Show 9-slice guides"><input type="checkbox" id="slices" checked /> Slices</label>
          <label class="check" id="mapToggle" hidden title="Paint a test map with the generated autotiles (m)"><input type="checkbox" id="map" /> Map</label>
          <select id="bg" title="Background">
            <option value="checker">Checker</option>
            <option value="#121216">Dark</option>
            <option value="#f2f2f2">Light</option>
            <option value="#5a8f4e">Grass</option>
            <option value="#4b88c9">Sky</option>
          </select>
          <span class="spacer"></span>
          <span id="hover" class="hover"></span>
        </div>

        <div class="canvas-wrap" id="canvasWrap">
          <canvas id="canvas" hidden></canvas>
          <div class="empty" id="empty">Select an asset</div>
          <div class="toast" id="toast" hidden></div>
        </div>

        <div class="timeline">
          <button id="play" class="play" title="Play / pause (space)">▶</button>
          <select id="tagSel" title="Playback range"></select>
          <div id="frames" class="frames"></div>
        </div>
      </section>

      <aside class="inspector">
        <section>
          <h2>Asset</h2>
          <dl id="meta" class="meta"></dl>
        </section>
        <section>
          <h2>Layers <small>view only</small></h2>
          <ul id="layers" class="layers"></ul>
        </section>
        <section>
          <h2>Palette <small id="paletteName"></small></h2>
          <div id="palette" class="palette"></div>
        </section>
        <section>
          <h2>Export</h2>
          <div class="export">
            <label>
              Format
              <select id="expFormat">
                <option value="sheet">Sprite sheet (PNG + JSON)</option>
                <option value="png">PNG, current frame</option>
                <option value="frames">PNG per frame</option>
                <option value="gif">Animated GIF</option>
                <option value="godot-spriteframes">Godot SpriteFrames (animations)</option>
                <option value="godot-stylebox" id="expGodot" disabled>Godot StyleBox (9-slice)</option>
                <option value="godot-tileset" id="expTileset" disabled>Godot TileSet (tiles)</option>
              </select>
            </label>
            <label>
              Scale
              <select id="expScale">
                <option>1</option><option>2</option><option>3</option><option selected>4</option>
                <option>6</option><option>8</option>
              </select>
            </label>
            <div class="row">
              <button id="expDownload" class="primary">Download</button>
              <button id="expSave" title="Write into the workspace exports/ folder">Save to exports/</button>
            </div>
            <p id="expResult" class="hint"></p>
          </div>
        </section>
      </aside>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
